; 全域預設：各規則的 rule.ini 沒有設定的區塊群組使用這裡的設定。
; 以區塊群組為單位取代，不逐鍵合併：rule.ini 有任何 [severity:*] 就整組取代嚴重度分級，
; 有任何 [grade:*] 就整組取代等級，[scoring]、[points] 各自整個區段取代。
; 各區段的說明見 code-review-scoring 的 templates/<語言>/rule-template.ini。

[scoring]
merge="false"

; A～F 六個面向與 G（其他與上游因素）的配分，合計必須為 100。
[points]
A="30"
B="20"
C="10"
D="10"
E="10"
F="10"
G="10"

; 嚴重度由上到下為嚴重到不嚴重，最後一級為最低級。
; 必須修正的問題沿用 SonarQube 傳統嚴重度的 Critical／Major／Minor，
; 風格層面的小問題沿用 Google Code Review 指引的 Nit。
[severity:Critical]
points="10"
cap="B"
meaning="資料損毀、資安事件或服務中斷。"

[severity:Major]
points="5"
meaning="特定情境下會出錯，或明顯降低品質。"

[severity:Minor]
points="2"
meaning="能運作，但有更好的寫法。"

[severity:Nit]
points="1"
meaning="風格偏好，不影響核准。"

; 等級由上到下為高到低，min 為最低總分，最後一級必須是 0。
[grade:A]
min="95"

[grade:B]
min="85"

[grade:C]
min="70"

[grade:D]
min="60"

[grade:F]
min="0"

; 不評分的檔案，所有規則共用，只能寫在 defaults.ini。
; 值為正規表示式（掃描規則的語法子集），區分大小寫；省略的鍵不排除任何檔案。
; build、lock、binary 比對檔案在儲存庫中的相對路徑，generated 比對檔案前 15 行新增的內容。
[exclude]
build="(^|/)(target|build|out|dist|\.gradle|node_modules)/|(^|/)generated(-sources|-test-sources)?/"
lock="(^|/)(package-lock\.json|yarn\.lock|pnpm-lock\.yaml|gradle\.lockfile)$|\.lock$"
binary="\.(class|jar|war|png|jpe?g|gif|ico|pdf|zip)$"
generated="@(javax|jakarta)\.annotation\.(processing\.)?Generated|DO NOT EDIT|[Aa]uto-generated"
