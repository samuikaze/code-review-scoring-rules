; Spring Boot 3 規則（繁體中文版）。路徑相對於本檔所在的目錄。
; en/ 有同一套規則的英文版（示範用）；要改用英文版時，把 rules.ini 中這套規則的 path 改成 springboot3-rule/en。
; 配分、嚴重度分級與等級使用 defaults.ini 的設定。
[rule]
standard="springboot-3-cr-scoring-rule.md"
scan="springboot-3-cr-scoring-rule.tsv"
applies="*.java, *.kt, *.sql, *.xml, *.yml, *.yaml, *.properties, *.gradle, *.kts"
