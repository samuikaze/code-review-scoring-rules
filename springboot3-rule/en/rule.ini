; The Spring Boot 3 rule (English). Paths are relative to the folder of this file.
; zh-tw/ has the same rule in Traditional Chinese (a demonstration); to use it, change the path of this rule in
; rules.ini to springboot3-rule/zh-tw.
; The points, severity scale and grades come from defaults.ini.
[rule]
standard="springboot-3-cr-scoring-rule.md"
scan="springboot-3-cr-scoring-rule.tsv"
applies="*.java, *.kt, *.sql, *.xml, *.yml, *.yaml, *.properties, *.gradle, *.kts"
