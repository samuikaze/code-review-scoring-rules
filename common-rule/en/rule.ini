; The common rule (English). Paths are relative to the folder of this file.
; zh-tw/ has the same rule in Traditional Chinese (a demonstration); to use it, change the path of this rule in
; rules.ini to common-rule/zh-tw.
; The severity scale comes from defaults.ini; a common rule never uses points, grades or cap of its own, and always
; takes them from defaults.ini.
[rule]
standard="common-cr-scoring-rule.md"
scan="common-cr-scoring-rule.tsv"
role="common"
