; 規則登錄：每套規則一個區段，區段名稱為規則名稱（須與標準文件前置資料的 name 一致）。
;   path    規則目錄（rule.ini 所在的目錄），完整路徑或相對於本檔所在目錄的路徑
;   enable  "true" 或 "false"；停用的規則不參與評分，standard lint 仍會檢查
; 規則不需要做多語言版本；本專案各規則的 zh-tw/、en/ 只是示範，由各規則 rule.ini 的 standard 與 scan 選擇其中一個。
; 啟用中的通用規則（role="common"）最多一套。

[springboot-3]
path="springboot3-rule"
enable="true"

[common]
path="common-rule"
enable="true"
